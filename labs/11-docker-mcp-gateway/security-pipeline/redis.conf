# security-pipeline/redis.conf
# Redis configuration for MCP rate limiting

# Bind to all interfaces (container network)
bind 0.0.0.0

# Protected mode off (we're in isolated Docker network)
protected-mode no

# Port
port 6379

# No persistence (rate limiting data is ephemeral)
save ""
appendonly no

# Memory limit
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""

# Security
requirepass ""  # No password needed (isolated network)

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Max clients
maxclients 100