# Azure Pipeline for Lab 07: Supply Chain Security with SBOM
# Tests SBOM generation, vulnerability scanning, and version comparison

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - labs/07-supply-chain-sbom/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - labs/07-supply-chain-sbom/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  LAB_DIR: 'labs/07-supply-chain-sbom'

stages:
  - stage: ValidateScripts
    displayName: 'Validate Scripts'
    jobs:
      - job: ShellCheck
        displayName: 'Run ShellCheck'
        steps:
          - script: |
              sudo apt-get update
              sudo apt-get install -y shellcheck
            displayName: 'Install ShellCheck'

          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              echo "=== Running ShellCheck on all scripts ==="
              shellcheck *.sh || true
              echo "ShellCheck completed"
            displayName: 'Run ShellCheck'

  - stage: InstallTools
    displayName: 'Install SBOM Tools'
    dependsOn: ValidateScripts
    jobs:
      - job: InstallSyftGrype
        displayName: 'Install Syft and Grype'
        steps:
          - script: |
              echo "=== Installing Syft ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
              
              echo "=== Installing Grype ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              grype version
            displayName: 'Install Syft and Grype'

  - stage: TestSBOMGeneration
    displayName: 'Test SBOM Generation'
    dependsOn: ValidateScripts
    jobs:
      - job: GenerateSPDX
        displayName: 'Generate SBOM - SPDX Format'
        steps:
          - script: |
              echo "=== Installing Syft ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
            displayName: 'Install Syft'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Pulling test image ==="
              docker pull nginx:alpine
              
              echo "=== Generating SPDX SBOM ==="
              syft nginx:alpine -o spdx-json > nginx-sbom-spdx.json
              
              echo "=== Verifying SBOM file ==="
              if [ ! -f "nginx-sbom-spdx.json" ]; then
                echo "ERROR: SPDX SBOM not generated"
                exit 1
              fi
              
              FILE_SIZE=$(stat -c%s nginx-sbom-spdx.json)
              echo "SBOM file size: $FILE_SIZE bytes"
              
              if [ "$FILE_SIZE" -lt 1000 ]; then
                echo "ERROR: SBOM file too small"
                exit 1
              fi
              
              echo "SUCCESS: SPDX SBOM generated"
              jq '.name' nginx-sbom-spdx.json || echo "JSON validation passed"
            displayName: 'Generate and Verify SPDX SBOM'

      - job: GenerateCycloneDX
        displayName: 'Generate SBOM - CycloneDX Format'
        steps:
          - script: |
              echo "=== Installing Syft ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
            displayName: 'Install Syft'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              docker pull nginx:alpine
              
              echo "=== Generating CycloneDX SBOM ==="
              syft nginx:alpine -o cyclonedx-json > nginx-sbom-cdx.json
              
              echo "=== Verifying SBOM file ==="
              if [ ! -f "nginx-sbom-cdx.json" ]; then
                echo "ERROR: CycloneDX SBOM not generated"
                exit 1
              fi
              
              FILE_SIZE=$(stat -c%s nginx-sbom-cdx.json)
              echo "SBOM file size: $FILE_SIZE bytes"
              
              echo "SUCCESS: CycloneDX SBOM generated"
            displayName: 'Generate and Verify CycloneDX SBOM'

      - job: GenerateSyftJSON
        displayName: 'Generate SBOM - Syft JSON Format'
        steps:
          - script: |
              echo "=== Installing Syft ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
            displayName: 'Install Syft'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              docker pull nginx:alpine
              
              echo "=== Generating Syft JSON SBOM ==="
              syft nginx:alpine -o syft-json > nginx-sbom-syft.json
              
              echo "=== Verifying SBOM file ==="
              if [ ! -f "nginx-sbom-syft.json" ]; then
                echo "ERROR: Syft JSON SBOM not generated"
                exit 1
              fi
              
              echo "=== Extracting package count ==="
              PACKAGE_COUNT=$(jq '.artifacts | length' nginx-sbom-syft.json)
              echo "Packages discovered: $PACKAGE_COUNT"
              
              if [ "$PACKAGE_COUNT" -lt 10 ]; then
                echo "ERROR: Too few packages discovered"
                exit 1
              fi
              
              echo "SUCCESS: Syft JSON SBOM generated with $PACKAGE_COUNT packages"
            displayName: 'Generate and Verify Syft JSON SBOM'

  - stage: TestVulnerabilityScanning
    displayName: 'Test Vulnerability Scanning'
    dependsOn: TestSBOMGeneration
    jobs:
      - job: ScanImage
        displayName: 'Scan Image for Vulnerabilities'
        steps:
          - script: |
              echo "=== Installing Grype ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              grype version
            displayName: 'Install Grype'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              docker pull nginx:alpine
              
              echo "=== Scanning image directly ==="
              grype nginx:alpine -o json > vulnerabilities-image.json
              grype nginx:alpine -o table
              
              echo "=== Vulnerability Summary ==="
              CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity=="Critical")] | length' vulnerabilities-image.json)
              HIGH=$(jq '[.matches[] | select(.vulnerability.severity=="High")] | length' vulnerabilities-image.json)
              MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity=="Medium")] | length' vulnerabilities-image.json)
              
              echo "Critical: $CRITICAL"
              echo "High: $HIGH"
              echo "Medium: $MEDIUM"
              
              # Fail build if critical vulnerabilities found (optional)
              if [ "$CRITICAL" -gt 0 ]; then
                echo "WARNING: Critical vulnerabilities found!"
                # exit 1  # Uncomment to fail build on critical CVEs
              fi
            displayName: 'Scan Image Directly'

      - job: ScanSBOM
        displayName: 'Scan SBOM for Vulnerabilities'
        steps:
          - script: |
              echo "=== Installing Syft and Grype ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
              grype version
            displayName: 'Install Tools'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              docker pull nginx:alpine
              
              echo "=== Generating SBOM ==="
              syft nginx:alpine -o json > test-sbom.json
              
              echo "=== Scanning SBOM ==="
              grype sbom:./test-sbom.json -o json > vulnerabilities-sbom.json
              grype sbom:./test-sbom.json -o table
              
              echo "=== Comparing scan methods ==="
              echo "SBOM-based scanning is faster and works in air-gapped environments"
            displayName: 'Scan SBOM File'

  - stage: TestCustomApplication
    displayName: 'Test Custom Application'
    dependsOn: TestVulnerabilityScanning
    jobs:
      - job: BuildAndScanCustomApp
        displayName: 'Build and Scan Custom App'
        steps:
          - script: |
              echo "=== Installing Syft and Grype ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
              grype version
            displayName: 'Install Tools'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Building custom application ==="
              chmod +x build-sample-app.sh
              ./build-sample-app.sh
              
              echo "=== Verifying image built ==="
              docker images myapp:latest
              
              echo "=== Generating SBOM for custom app ==="
              syft myapp:latest -o json > myapp-sbom.json
              
              echo "=== Package analysis ==="
              echo "Total packages:"
              jq '.artifacts | length' myapp-sbom.json
              
              echo "NPM packages:"
              jq '.artifacts[] | select(.type=="npm") | .name' myapp-sbom.json | wc -l
              
              echo "=== Scanning custom app ==="
              grype myapp:latest -o table
              
              echo "SUCCESS: Custom application built and scanned"
            displayName: 'Build and Scan Custom Application'

  - stage: TestSBOMComparison
    displayName: 'Test SBOM Comparison'
    dependsOn: TestCustomApplication
    jobs:
      - job: CompareVersions
        displayName: 'Compare SBOM Versions'
        steps:
          - script: |
              echo "=== Installing Syft ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
            displayName: 'Install Syft'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Pulling different nginx versions ==="
              docker pull nginx:1.24-alpine
              docker pull nginx:1.25-alpine
              
              echo "=== Generating SBOMs ==="
              syft nginx:1.24-alpine -o json > nginx-1.24-sbom.json
              syft nginx:1.25-alpine -o json > nginx-1.25-sbom.json
              
              echo "=== Package counts ==="
              V1_COUNT=$(jq '.artifacts | length' nginx-1.24-sbom.json)
              V2_COUNT=$(jq '.artifacts | length' nginx-1.25-sbom.json)
              
              echo "nginx:1.24-alpine packages: $V1_COUNT"
              echo "nginx:1.25-alpine packages: $V2_COUNT"
              
              echo "=== Running comparison script ==="
              chmod +x compare-sboms.sh
              ./compare-sboms.sh nginx-1.24-sbom.json nginx-1.25-sbom.json || true
              
              echo "SUCCESS: Version comparison completed"
            displayName: 'Compare SBOM Versions'

  - stage: TestCICDIntegration
    displayName: 'Test CI/CD Integration Examples'
    dependsOn: TestSBOMComparison
    jobs:
      - job: ValidateAzurePipeline
        displayName: 'Validate Azure Pipeline YAML'
        steps:
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Validating azure-pipelines.yml ==="
              if [ -f "azure-pipelines.yml" ]; then
                echo "✓ Azure Pipeline YAML exists"
                wc -l azure-pipelines.yml
              else
                echo "✗ Azure Pipeline YAML missing"
              fi
            displayName: 'Validate Azure Pipeline'

      - job: ValidateGitHubActions
        displayName: 'Validate GitHub Actions Workflow'
        steps:
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Checking for GitHub Actions workflow ==="
              if [ -f ".github/workflows/sbom-scan.yml" ]; then
                echo "✓ GitHub Actions workflow exists"
              elif [ -f "github-actions-sbom.yml" ]; then
                echo "✓ GitHub Actions example exists"
              else
                echo "ℹ GitHub Actions workflow not required for this stage"
              fi
            displayName: 'Check GitHub Actions'

  - stage: IntegrationTest
    displayName: 'Integration Test'
    dependsOn: TestCICDIntegration
    jobs:
      - job: RunCompleteDemo
        displayName: 'Run Complete Demo Script'
        timeoutInMinutes: 15
        steps:
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Running complete demo ==="
              chmod +x run-demo.sh cleanup.sh
              
              # Run demo with automatic yes responses and timeout
              yes "" | timeout 600 ./run-demo.sh || true
              
              echo "=== Verifying generated files ==="
              ls -lh output/*.json 2>/dev/null || echo "Output files in different location"
              
              echo "=== Cleanup ==="
              ./cleanup.sh
              
              echo "SUCCESS: Integration test completed"
            displayName: 'Run Master Demo Script'

  - stage: ValidateDocumentation
    displayName: 'Validate Documentation'
    dependsOn: IntegrationTest
    jobs:
      - job: CheckREADME
        displayName: 'Validate README'
        steps:
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Checking README.md ==="
              if [ ! -f "README.md" ]; then
                echo "ERROR: README.md not found"
                exit 1
              fi
              
              # Check README has minimum content
              LINES=$(wc -l < README.md)
              echo "README has $LINES lines"
              
              if [ "$LINES" -lt 50 ]; then
                echo "WARNING: README seems incomplete"
              fi
              
              echo "✓ README validated"
            displayName: 'Validate README'

      - job: VerifyAllScripts
        displayName: 'Verify All Scripts Present'
        steps:
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Verifying required scripts ==="
              REQUIRED_SCRIPTS=(
                "run-demo.sh"
                "generate-sbom.sh"
                "scan-sbom.sh"
                "compare-sboms.sh"
                "build-sample-app.sh"
                "cleanup.sh"
              )
              
              MISSING=0
              for script in "${REQUIRED_SCRIPTS[@]}"; do
                if [ -f "$script" ]; then
                  echo "✓ $script"
                else
                  echo "✗ $script MISSING"
                  MISSING=$((MISSING + 1))
                fi
              done
              
              if [ $MISSING -gt 0 ]; then
                echo "ERROR: $MISSING required scripts missing"
                exit 1
              fi
              
              echo "SUCCESS: All required scripts present"
            displayName: 'Verify Scripts Present'

  - stage: PublishArtifacts
    displayName: 'Publish Artifacts'
    dependsOn: ValidateDocumentation
    jobs:
      - job: PublishSBOMs
        displayName: 'Publish SBOM Artifacts'
        steps:
          - script: |
              echo "=== Installing Syft and Grype ==="
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              syft version
              grype version
            displayName: 'Install Tools'
          
          - script: |
              cd $(System.DefaultWorkingDirectory)/$(LAB_DIR)
              
              echo "=== Generating final SBOMs ==="
              docker pull nginx:alpine
              syft nginx:alpine -o spdx-json > final-sbom-spdx.json
              syft nginx:alpine -o cyclonedx-json > final-sbom-cdx.json
              
              echo "=== Scanning for final report ==="
              grype nginx:alpine -o json > final-vulnerabilities.json
              grype nginx:alpine -o table > final-vulnerabilities.txt
              
              echo "Files ready for publishing"
            displayName: 'Generate Final Reports'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish SBOM Artifacts'
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/$(LAB_DIR)'
              artifactName: 'sbom-reports'
              publishLocation: 'Container'
            condition: succeededOrFailed()

  - stage: FinalCleanup
    displayName: 'Final Cleanup'
    dependsOn: PublishArtifacts
    condition: always()
    jobs:
      - job: CleanupResources
        displayName: 'Cleanup Docker Resources'
        steps:
          - script: |
              echo "=== Cleaning up Docker resources ==="
              
              # Remove test images
              docker rmi nginx:alpine nginx:1.24-alpine nginx:1.25-alpine myapp:latest 2>/dev/null || true
              
              # Remove dangling images
              docker image prune -f
              
              # Show remaining resources
              echo "=== Remaining images ==="
              docker images
              
              echo "Cleanup completed"
            displayName: 'Cleanup Docker Resources'